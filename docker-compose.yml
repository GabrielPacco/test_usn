services:
  mysql:
    image: mysql:8.0
    container_name: social_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: railway
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: social_backend
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/railway
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  socket:
    build:
      context: ./socket
    container_name: social_socket
    restart: always
    ports:
      - "8800:8800"

  ai-service:
    build:
      context: ./ai-service
    container_name: social_ai_service
    restart: always
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./client
    container_name: social_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://backend:5000
      AI_URL: http://ai-service:8000
      SOCKET_URL: http://socket:8800
    depends_on:
      - backend
      - socket

volumes:
  mysql_data: