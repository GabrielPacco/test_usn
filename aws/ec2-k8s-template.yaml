AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Universe Social Network sobre Kubernetes (k3s) en una EC2. Instala k3s y Docker, clona el
  repositorio, construye las imagenes, las importa en k3s y aplica los manifiestos de k8s/.
  El stack termina (CREATE_COMPLETE) solo cuando la aplicacion responde en el puerto 80.

Parameters:
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
    Description: t3.large (2 vCPU, 8 GiB) permite que el HPA escale el backend hasta 6 replicas.

  KeyName:
    Type: String
    Default: ''
    Description: >-
      (Opcional) Par de claves para SSH ("vockey" en Learner Lab). Vacio = sin clave; se puede
      entrar igual con EC2 Instance Connect desde la consola.

  SSHCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: Rango de IPs que pueden entrar por SSH (por ejemplo, TU_IP/32).

  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 60
    Description: Disco raiz en GiB (imagenes Docker + copia importada en k3s).

  RepoUrl:
    Type: String
    Default: https://github.com/GabrielPacco/test_usn.git
    Description: Repositorio con el codigo y los manifiestos.

  RepoBranch:
    Type: String
    Default: main
    Description: Rama a desplegar.

  CloudinaryCloudName:
    Type: String
    Default: ''
    Description: (Opcional) Cloudinary para subir fotos. Vacio = la app funciona sin subida de imagenes.

  CloudinaryApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: (Opcional) API key de Cloudinary.

  CloudinaryApiSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: (Opcional) API secret de Cloudinary.

  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: AMI de Ubuntu 22.04 mas reciente (se resuelve sola en cualquier region).

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  USNSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Universe Social Network - solo SSH y HTTP (nginx reenvia /api, /ai y /socket.io)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: usn-k8s-security-group

  # El UserData avisa aqui cuando la app esta lista (o si falla)
  USNWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  USNWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: USNK8sInstance
    Properties:
      Handle: !Ref USNWaitHandle
      Timeout: '2400'
      Count: 1

  USNK8sInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestUbuntuAmi
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      SecurityGroupIds:
        - !Ref USNSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/usn-setup.log) 2>&1

          signal() {
            curl -s -X PUT -H 'Content-Type:' \
              --data-binary "{\"Status\":\"$1\",\"Reason\":\"$2\",\"UniqueId\":\"usn\",\"Data\":\"$2\"}" \
              '${USNWaitHandle}' || true
          }
          trap 'signal FAILURE "Fallo en la linea $LINENO. Ver /var/log/usn-setup.log"' ERR

          # 1. Paquetes base y Docker (solo para construir las imagenes)
          apt-get update -y
          apt-get install -y git curl ca-certificates docker.io
          systemctl enable --now docker

          # 2. Kubernetes (k3s). Trae metrics-server (HPA) y ServiceLB (LoadBalancer en la IP del nodo)
          curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          until kubectl get nodes | grep -qw Ready; do sleep 3; done

          mkdir -p /home/ubuntu/.kube
          cp /etc/rancher/k3s/k3s.yaml /home/ubuntu/.kube/config
          chown -R ubuntu:ubuntu /home/ubuntu/.kube
          usermod -aG docker ubuntu
          echo 'export KUBECONFIG=/home/ubuntu/.kube/config' >> /home/ubuntu/.bashrc
          echo 'alias k="kubectl -n usn"' >> /home/ubuntu/.bashrc

          # 3. Codigo
          git clone -b '${RepoBranch}' '${RepoUrl}' /home/ubuntu/app
          chown -R ubuntu:ubuntu /home/ubuntu/app
          cd /home/ubuntu/app

          # 4. Imagenes: se construyen en la EC2 y se importan en k3s (sin Docker Hub)
          docker build -t teriyaki08/usn-backend:v1 backend
          docker build -t teriyaki08/usn-socket:v1 socket
          docker build -t teriyaki08/usn-ai-service:v1 ai-service
          docker build -t teriyaki08/usn-frontend:v1 --build-arg APP_VERSION=v1 client
          docker build -t teriyaki08/usn-frontend:v2 --build-arg APP_VERSION=v2 client
          for img in usn-backend:v1 usn-socket:v1 usn-ai-service:v1 usn-frontend:v1 usn-frontend:v2; do
            docker save teriyaki08/$img | k3s ctr images import -
          done

          # 5. Despliegue (las claves de Cloudinary van a un Secret, nunca al repo ni a la imagen)
          kubectl apply -f k8s/00-namespace.yaml
          set +x   # no escribir las claves en /var/log/usn-setup.log
          kubectl -n usn create secret generic jwt-secret --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
          if [ -n '${CloudinaryCloudName}' ]; then
            kubectl -n usn create secret generic cloudinary-secret               --from-literal=CLOUDINARY_CLOUD_NAME='${CloudinaryCloudName}'               --from-literal=CLOUDINARY_API_KEY='${CloudinaryApiKey}'               --from-literal=CLOUDINARY_API_SECRET='${CloudinaryApiSecret}'
          fi
          set -x
          kubectl apply -f k8s/
          for d in mysql redis backend socket ai-service frontend; do
            kubectl -n usn rollout status deployment/$d-deployment --timeout=600s
          done

          # 6. Comprobacion final a traves de nginx (puerto 80)
          for i in $(seq 1 60); do
            if curl -sf http://localhost/version && curl -sf -o /dev/null http://localhost/ai/health; then
              echo "Universe Social Network listo." > /home/ubuntu/k8s_ready.txt
              signal SUCCESS "Aplicacion lista en el puerto 80"
              exit 0
            fi
            sleep 5
          done
          signal FAILURE "La app no respondio en el puerto 80. Ver /var/log/usn-setup.log"
      Tags:
        - Key: Name
          Value: usn-k8s-node
        - Key: Project
          Value: UniverseSocialNetwork

  # IP fija: no cambia si la instancia se detiene y se vuelve a iniciar
  USNElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref USNK8sInstance
      Tags:
        - Key: Name
          Value: usn-k8s-eip

Outputs:
  PublicIP:
    Description: IP publica fija (Elastic IP)
    Value: !Ref USNElasticIP

  AppURL:
    Description: Aplicacion web (frontend + /api + /ai + /socket.io por nginx)
    Value: !Sub 'http://${USNElasticIP}'

  VersionURL:
    Description: Version desplegada del frontend (para la demo de rolling update)
    Value: !Sub 'http://${USNElasticIP}/version'

  AIDocsURL:
    Description: Documentacion OpenAPI del servicio de IA
    Value: !Sub 'http://${USNElasticIP}/ai/docs'

  SSHCommand:
    Description: Conexion SSH (o usar EC2 Instance Connect desde la consola)
    Value: !If
      - HasKeyName
      - !Sub 'ssh -i ${KeyName}.pem ubuntu@${USNElasticIP}'
      - 'Sin KeyName: EC2 > Instancias > Conectar > EC2 Instance Connect'
