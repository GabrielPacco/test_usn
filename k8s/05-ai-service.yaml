apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-deployment
  namespace: usn
  labels:
    app: ai-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/gabrielpacco/usn-ai-service:v1
          imagePullPolicy: IfNotPresent
          # Detrás de nginx en /ai: root-path hace que /ai/docs cargue /ai/openapi.json
          args: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/ai"]
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: usn
  labels:
    app: ai-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ai-service
