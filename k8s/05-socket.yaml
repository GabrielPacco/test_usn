apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-deployment
  namespace: usn
  labels:
    app: socket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: socket
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: socket
    spec:
      # Repartir las réplicas entre los nodos: si cae uno, siempre queda otra réplica viva
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: socket
      # Si su nodo deja de responder, mover el pod tras 30 s (por defecto son 300 s)
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: socket
          image: ghcr.io/gabrielpacco/usn-socket:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8800
              name: ws
          env:
            - name: PORT
              value: "8800"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8800
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: socket-service
  namespace: usn
  labels:
    app: socket
spec:
  type: ClusterIP
  ports:
    - port: 8800
      targetPort: 8800
      name: ws
  selector:
    app: socket
