apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-deployment
  namespace: usn
  labels:
    app: socket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: socket
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: socket
    spec:
      containers:
        - name: socket
          image: teriyaki08/usn-socket:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8800
              name: ws
          env:
            - name: PORT
              value: "8800"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8800
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: socket-service
  namespace: usn
  labels:
    app: socket
spec:
  type: ClusterIP
  ports:
    - port: 8800
      targetPort: 8800
      name: ws
  selector:
    app: socket
