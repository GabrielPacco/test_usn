# Discos EBS gp3 creados bajo demanda por el driver CSI de AWS (ebs.csi.aws.com).
# WaitForFirstConsumer: el disco se crea en la zona del nodo donde se programa el pod.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
