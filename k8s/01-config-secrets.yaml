apiVersion: v1
kind: ConfigMap
metadata:
  name: usn-config
  namespace: usn
data:
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "railway"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  BACKEND_PORT: "5000"
  SOCKET_PORT: "8800"
---
apiVersion: v1
kind: Secret
metadata:
  name: usn-secrets
  namespace: usn
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "admin"
  MYSQL_DATABASE: "railway"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_DATASOURCE_PASSWORD: "admin"
  JWT_SECRET: "usn_super_secret_jwt_key_2026_unsa_cloud_deployment_32bytes"
